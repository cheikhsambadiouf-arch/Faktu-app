version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: faktu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: faktu
      POSTGRES_PASSWORD: faktu
      POSTGRES_DB: faktu
    ports:
      - "5432:5432"
    volumes:
      - faktu_pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: faktu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: faktu_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://faktu:faktu@postgres:5432/faktu
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  faktu_pg_data:
